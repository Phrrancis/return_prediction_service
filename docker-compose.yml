services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_KEY=dev-key
      - DATABASE_URL=sqlite:///./predictions.db
      - ML_MODEL_PATH=model_artifacts/model.pkl
    volumes:
      - ./predictions.db:/app/predictions.db
      - ./model_artifacts:/app/model_artifacts
