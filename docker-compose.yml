services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_KEY=dev-key
      - SHOPIFY_WEBHOOK_SECRET=dev-secret
      - RETURN_WINDOW_DAYS=30
      - LOGISTICS_BUFFER_DAYS=14
      - DB_PATH=returnml.db
    volumes:
      - ./returnml.db:/app/returnml.db
      - ./models:/app/models
      - ./reports:/app/reports
